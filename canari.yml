# ~/ai-server/compose/canari.yml — Mode CANARI : Qwen, contexte 32K, GPU 0+1
#
# Le plus simple : COPIE ton llama-server.yml (mode RAG, Qwen 16k sur GPU 0) et ne change
# que les 4 points marqués ⚙️. Image, volume et fichier modèle restent identiques.
# Les arguments ci-dessous sont ceux de llama.cpp server ; adapte-les si ton image en utilise d'autres.
#
# Pourquoi 32K : la synthèse demande ~15K tokens en entrée + ~6K en sortie, donc 16K ne suffit pas.
# Pourquoi GPU 0+1 : doubler le contexte double la mémoire du cache ; le GPU 1 est libre (pas d'embeddings).

services:
  llama-server:
    container_name: llama-server            # même nom qu'en mode RAG : stop_all() sait l'arrêter
    image: <même image que llama-server.yml>
    ports:
      - "8080:8080"
    volumes:
      - <même dossier de modèles que llama-server.yml>:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0", "1"]       # ⚙️ 1. les deux GPU (au lieu du GPU 0 seul)
              capabilities: [gpu]
    command: >
      -m /models/<même fichier Qwen que llama-server.yml>.gguf
      --host 0.0.0.0 --port 8080
      -c 32768
      -np 1
      -ngl 999 --split-mode layer --tensor-split 1,1
      --jinja
    # ⚙️ 2. -c 32768 : contexte 32K (au lieu de 16K)
    # ⚙️ 3. -np 1 : une seule requête à la fois, pour qu'elle dispose de tout le contexte
    #        (llama.cpp partage le contexte entre ses "slots")
    # ⚙️ 4. --tensor-split 1,1 : modèle réparti à parts égales sur les deux cartes
    # Si la VRAM ne suffit pas : ajouter  -fa --cache-type-k q8_0 --cache-type-v q8_0
    # (cache de contexte compressé, environ moitié moins de mémoire)
    restart: "no"
